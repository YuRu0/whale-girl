<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self'; img-src 'self' data:">
<title>鲸鱼娘来啦</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Microsoft YaHei UI','Segoe UI',sans-serif;user-select:none}
body{opacity:0;animation:arrive .7s ease forwards}.scene{position:relative;width:100%;height:100%;display:grid;place-items:center;isolation:isolate}
.halo{position:absolute;top:70px;left:215px;width:390px;height:350px;border-radius:50%;background:radial-gradient(ellipse,#dffafff5 0%,#a7d8ff99 45%,#acd8ff00 72%);filter:blur(16px);animation:breathe 3s ease-in-out infinite}
.ring{position:absolute;left:210px;top:367px;width:400px;height:85px;border:1px solid #a5dfff99;border-radius:50%;box-shadow:0 0 30px #83cfff55,inset 0 0 30px #b4e6ff22;animation:ripple 2.8s ease-out infinite}.ring.second{animation-delay:1.4s}
video{position:absolute;top:23px;left:0;width:820px;height:461px;object-fit:contain;filter:drop-shadow(0 15px 13px #07366a20)}
.caption{position:absolute;top:434px;left:190px;width:440px;text-align:center;color:#effaff;text-shadow:0 2px 16px #073f79,0 1px 3px #1d4b79;animation:rise 1s .3s both}
.eyebrow{font-size:10px;letter-spacing:5px;color:#d8f4ff}.title{margin:9px 0 8px;font-size:29px;font-weight:600;letter-spacing:8px}.greeting{font-size:13px;letter-spacing:2px;margin:0}.track{width:118px;height:2px;margin:20px auto;background:#bcdfff55;overflow:hidden;border-radius:2px}.track::after{content:'';display:block;height:100%;background:#edfaff;transform-origin:left;animation:load 5.8s linear forwards}
.skip{position:absolute;top:41px;right:75px;background:#153c6245;color:#f4fbff;border:1px solid #e2f6ff55;border-radius:18px;padding:7px 13px;font-size:11px;cursor:pointer;z-index:5}.skip:hover{background:#245b8599}.spark{position:absolute;color:#dff8ff;text-shadow:0 0 15px #58b7ef;font-size:20px;animation:float 3s ease-in-out infinite}.a{left:252px;top:124px}.b{right:250px;top:210px;animation-delay:1s;font-size:13px}.c{left:276px;top:321px;animation-delay:1.8s;font-size:10px}
body.depart{animation:leave .45s ease forwards}@keyframes arrive{to{opacity:1}}@keyframes leave{to{opacity:0;transform:translateY(15px) scale(.97)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes breathe{50%{transform:scale(1.08);opacity:.8}}@keyframes ripple{from{transform:scale(.65);opacity:.8}to{transform:scale(1.35);opacity:0}}@keyframes float{50%{transform:translateY(-13px);opacity:.45}}@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){*,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}body{opacity:1}}
</style>
<div class="scene">
  <div class="halo"></div><div class="ring"></div><div class="ring second"></div>
  <span class="spark a">✦</span><span class="spark b">✧</span><span class="spark c">✦</span>
  <video autoplay muted playsinline src="vendor/dsh-pet/assets/webm/女仆屈膝礼仪.webm"></video>
  <button class="skip" type="button">跳过 · Esc</button>
  <div class="caption"><div class="eyebrow">DEEP BLUE · LITTLE COMPANION</div><h1 class="title">鲸鱼娘来啦</h1><p class="greeting">予薷，今天也一起加油。</p><div class="track"></div></div>
</div>
<script src="splash.js"></script>
</html>
