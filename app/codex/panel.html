<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>守岸人 · 用量观测</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main class="shell" id="shell" aria-label="守岸人 · 用量观测">
    <header class="head">
      <div class="avatar" aria-hidden="true"><img src="assets/avatar.png" alt=""></div>
      <div class="brand">
        <h1>守岸人<span class="sep">·</span>用量观测</h1>
        <p class="sub" id="subtitle">CC Switch 本地记录 · 读取中</p>
      </div>
      <div class="actions">
        <button class="icon-btn" id="btn-refresh" type="button" aria-label="刷新数据" title="刷新">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg>
        </button>
        <button class="icon-btn" id="btn-broadcast" type="button" aria-label="播报到鲸鱼娘气泡" title="播报到鲸鱼娘气泡">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-8l-4.5 3v-3H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5z"/><path d="M8 10h8M8 13h5"/></svg>
        </button>
        <button class="icon-btn close" id="btn-close" type="button" aria-label="关闭面板" title="关闭（Esc）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="统计周期">
      <button class="tab" type="button" role="tab" data-period="today" aria-controls="scroll">今日</button>
      <button class="tab" type="button" role="tab" data-period="d7" aria-controls="scroll">7 天</button>
      <button class="tab" type="button" role="tab" data-period="month" aria-controls="scroll">本月</button>
      <button class="tab" type="button" role="tab" data-period="all" aria-controls="scroll">全部</button>
    </nav>

    <div class="scroll" id="scroll">
      <section class="hero" id="hero" aria-live="polite">
        <div class="eyebrow">Total Tokens<span class="zh" id="hero-period">今日</span></div>
        <div class="hero-num"><b id="hero-total">—</b><span class="unit">tokens</span></div>
        <div class="hero-stats">
          <div class="stat"><b id="st-req">—</b><span>请求次数</span></div>
          <div class="stat"><b id="st-cost">—</b><span>成本</span></div>
          <div class="stat"><b id="st-hit">—</b><span>缓存命中</span></div>
        </div>
        <div class="compose" id="compose">
          <div class="compose-bar" id="compose-bar"></div>
          <div class="compose-legend" id="compose-legend"></div>
        </div>
        <p class="note" id="hero-note"></p>
      </section>

      <section class="block" aria-labelledby="h-apps">
        <div class="sec-head"><h2 id="h-apps">按应用</h2><span class="en">Apps</span><span class="aux" id="apps-aux"></span></div>
        <div id="app-list"></div>
      </section>

      <section class="block" aria-labelledby="h-live">
        <div class="sec-head"><h2 id="h-live">Codex 当前会话</h2><span class="en">Live</span><span class="aux" id="live-aux"></span></div>
        <div class="live">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 96 96" aria-hidden="true">
              <defs>
                <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#c9f1ff"/>
                  <stop offset="0.6" stop-color="#9fe3ff"/>
                  <stop offset="1" stop-color="#e8d5a0"/>
                </linearGradient>
              </defs>
              <circle class="ring-dots" cx="48" cy="48" r="30"/>
              <circle class="ring-track" cx="48" cy="48" r="40"/>
              <circle class="ring-val" id="ring-val" cx="48" cy="48" r="40" transform="rotate(-90 48 48)" stroke-dasharray="0 252"/>
            </svg>
            <div class="ring-label"><b id="ring-pct">—</b><span>上下文</span></div>
          </div>
          <dl class="kv" id="live-kv"></dl>
        </div>
      </section>

      <section class="block" aria-labelledby="h-trend">
        <div class="sec-head"><h2 id="h-trend">近 30 天</h2><span class="en">Trend</span><span class="aux" id="trend-aux"></span></div>
        <div id="trend-chart" class="chart-box"></div>
        <div class="legend" id="trend-legend"></div>
      </section>

      <section class="block" aria-labelledby="h-heat">
        <div class="sec-head"><h2 id="h-heat">活跃时段</h2><span class="en">7 × 24</span><span class="aux" id="heat-aux"></span></div>
        <div class="heat" id="heat-grid"></div>
      </section>

      <section class="block" aria-labelledby="h-models">
        <div class="sec-head"><h2 id="h-models">模型排行</h2><span class="en">Models</span><span class="aux" id="models-aux"></span></div>
        <ol class="models" id="model-list"></ol>
      </section>

      <section class="block" aria-labelledby="h-prov">
        <div class="sec-head"><h2 id="h-prov">供应商与余额</h2><span class="en">Providers</span><span class="aux" id="prov-aux"></span></div>
        <div class="prov" id="prov-list"></div>
        <button class="link-btn" id="btn-ccswitch" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5h5v5"/><path d="M19 5l-8 8"/><path d="M18 14v4.5a.5.5 0 0 1-.5.5h-12a.5.5 0 0 1-.5-.5v-12a.5.5 0 0 1 .5-.5H10"/></svg>
          打开 CC Switch
        </button>
      </section>

      <footer class="foot" id="foot">
        <div class="divider"></div>
        <p>总量 = 未缓存输入 + 缓存读取 + 缓存写入 + 输出。Codex 记录的输入已包含缓存读取，这里拆开计算，不重复。</p>
        <p>成本取自 CC Switch 定价表；未定价的模型按 0 计，不做估算。数据只在本机只读读取，不上传。</p>
        <p class="src" id="foot-src"></p>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="tip" id="tip" role="tooltip"></div>
  </main>
  <script src="panel.js"></script>
</body>
</html>
