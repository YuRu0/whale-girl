name: 🐛 问题反馈
description: 报告一个 Bug 或异常表现
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填完整，能省掉我们互相猜的时间。

  - type: input
    id: version
    attributes:
      label: 鲸鱼娘版本
      description: 托盘图标右键 → 关于，或看安装包文件名
      placeholder: "1.3.3"
    validations:
      required: true

  - type: input
    id: codex-version
    attributes:
      label: Codex 版本
      placeholder: "例如 0.98.0"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: 系统版本
      placeholder: "Windows 11 23H2 22631.xxxx"
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 出问题的模块
      options:
        - 桌面宠物
        - Codex 界面主题
        - 启动动画
        - 用量面板 / 播报
        - 安装 / 卸载
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象描述
      description: 你看到了什么？和预期有什么不同？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好
      placeholder: |
        1. 从托盘打开 Codex
        2. ...
        3. 出现黑色遮挡
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 位于 `安装目录\data\运行日志.txt`，贴最后几十行即可。**提交前请删掉其中的个人信息。**
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 截图
      description: 拖进来即可。**注意别截到敏感内容。**
    validations:
      required: false
